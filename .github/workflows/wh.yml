name: wheelhouse
on:
  push:
    branches: [tmp-wheelhouse]
jobs:
  wh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip
          mkdir wheels
          python -m pip download -d wheels --only-binary=:all: \
            "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2" "statsmodels>=0.14,<1" \
            "pydantic>=2.7,<3" "PyYAML>=6.0,<7" pytest pytest-cov hypothesis ruff mypy \
            types-PyYAML pyarrow setuptools wheel build \
            "fastapi>=0.115" "uvicorn[standard]>=0.30" "sqlalchemy>=2.0" "psycopg[binary]>=3.2" \
            "alembic>=1.13" "argon2-cffi>=23.1" "pyotp>=2.9" "redis>=5.0" "httpx>=0.27" \
            "pydantic-settings>=2.4" pytest-asyncio aiosqlite fakeredis
          python -m pip download -d wheels "smartapi-python==1.5.5" "websocket-client==0.59.0" "pyotp==2.10.0" "logzero==1.7.0" || true
          ls wheels | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels
